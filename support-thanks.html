<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ご支援ありがとうございます | スコアブック by CuViu</title>
    <style>
        :root {
            --ink: #172331;
            --muted: #607180;
            --line: #d7e4ea;
            --accent: #0f766e;
            --soft: #eef8fb;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #f4fbff;
            color: var(--ink);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            line-height: 1.7;
        }

        main {
            width: min(760px, calc(100vw - 28px));
            margin: 0 auto;
            padding: 28px 0 40px;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            min-height: 38px;
            padding: 6px 14px;
            border: 2px solid #cfe1eb;
            border-radius: 999px;
            background: #ffffff;
            color: var(--accent);
            font-size: 15px;
            font-weight: 900;
        }

        .panel {
            margin-top: 18px;
            padding: 24px;
            border: 2px solid var(--line);
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.94);
            box-shadow: 0 18px 45px rgba(23, 35, 49, 0.08);
        }

        h1 {
            margin: 0 0 12px;
            font-size: clamp(28px, 8vw, 44px);
            line-height: 1.18;
            letter-spacing: 0;
        }

        p {
            margin: 0;
            color: var(--muted);
            font-size: 16px;
            font-weight: 700;
        }

        .steps {
            display: grid;
            gap: 10px;
            margin: 22px 0 0;
            padding: 0;
            list-style: none;
            counter-reset: step;
        }

        .steps li {
            counter-increment: step;
            display: grid;
            grid-template-columns: 34px minmax(0, 1fr);
            gap: 10px;
            align-items: start;
            padding: 12px;
            border: 1.5px solid var(--line);
            border-radius: 12px;
            background: var(--soft);
            color: var(--ink);
            font-size: 16px;
            font-weight: 850;
        }

        .steps li::before {
            content: counter(step);
            display: grid;
            place-items: center;
            width: 30px;
            height: 30px;
            border-radius: 999px;
            background: var(--accent);
            color: #ffffff;
            font-size: 15px;
            font-weight: 900;
            line-height: 1;
        }

        .note {
            margin-top: 18px;
            padding: 12px 14px;
            border-left: 5px solid var(--accent);
            border-radius: 10px;
            background: #ffffff;
            color: var(--muted);
            font-size: 14px;
            font-weight: 750;
        }

        .feature-links {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 18px;
        }

        .feature-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 38px;
            padding: 7px 12px;
            border: 1.5px solid var(--line);
            border-radius: 999px;
            background: #ffffff;
            color: var(--muted);
            font-size: 14px;
            font-weight: 850;
            text-decoration: none;
        }

        .feature-link.active {
            border-color: var(--accent);
            background: var(--accent);
            color: #ffffff;
        }

        .passphrase {
            display: grid;
            gap: 6px;
            margin-top: 20px;
            padding: 14px;
            border: 2px dashed #b8d4de;
            border-radius: 14px;
            background: #ffffff;
        }

        .passphrase-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 48px;
            gap: 10px;
            align-items: center;
        }

        .passphrase-label {
            color: var(--muted);
            font-size: 13px;
            font-weight: 900;
        }

        .passphrase-code {
            color: var(--ink);
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: clamp(24px, 7vw, 34px);
            font-weight: 900;
            line-height: 1.25;
            overflow-wrap: anywhere;
        }

        .copy-code-button {
            display: inline-grid;
            place-items: center;
            width: 48px;
            height: 48px;
            border: 2px solid var(--accent);
            border-radius: 12px;
            background: #ffffff;
            color: var(--accent);
            cursor: pointer;
            touch-action: manipulation;
        }

        .copy-code-button svg {
            width: 24px;
            height: 24px;
            stroke: currentColor;
            stroke-width: 2.25;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }

        .copy-code-button:active,
        .copy-code-button.copied {
            background: var(--accent);
            color: #ffffff;
        }

        .copy-status {
            min-height: 20px;
            color: var(--accent);
            font-size: 13px;
            font-weight: 850;
        }

        .copy-status.error {
            color: #b42318;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 22px;
        }

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 48px;
            padding: 10px 14px;
            border: 2px solid #243447;
            border-radius: 12px;
            background: #ffffff;
            color: var(--ink);
            font-size: 16px;
            font-weight: 900;
            text-align: center;
            text-decoration: none;
        }

        .button.primary {
            border-color: var(--accent);
            background: var(--accent);
            color: #ffffff;
        }

        @media (max-width: 520px) {
            .panel {
                padding: 20px;
            }

            .actions {
                display: block;
            }
        }
    </style>
</head>
<body>
    <main>
        <div class="brand">CuViu Scorebook</div>
        <section class="panel" aria-labelledby="thanksTitle">
            <h1 id="thanksTitle">ご支援ありがとうございます。</h1>
            <p id="thanksLead">支援者向けに、PDFフッター文言の編集を使えるようにしています。</p>

            <nav class="feature-links" aria-label="支援特典の案内切り替え">
                <a id="featureLinkFooter" class="feature-link" href="?feature=footer">フッター編集</a>
                <a id="featureLinkSaves" class="feature-link" href="?feature=saves">保存上限解除</a>
                <a id="featureLinkShare" class="feature-link" href="?feature=share">チーム共有</a>
            </nav>

            <div class="passphrase" aria-labelledby="passphraseLabel">
                <div id="passphraseLabel" class="passphrase-label">合言葉</div>
                <div class="passphrase-row">
                    <div id="passphraseCode" class="passphrase-code">◇余白27◇</div>
                    <button id="copyPassphraseButton" class="copy-code-button" type="button" onclick="copyPassphraseCode()" aria-label="合言葉をコピー" title="合言葉をコピー">
                        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                            <rect x="8" y="8" width="10" height="12" rx="2"></rect>
                            <path d="M6 16H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v1"></path>
                        </svg>
                    </button>
                </div>
                <div id="copyStatus" class="copy-status" role="status" aria-live="polite"></div>
            </div>

            <ol id="thanksSteps" class="steps">
                <li>スコアブックを開き、新規試合を始めます。</li>
                <li>新規試合を始めた後、画面左上のバージョン表示を7回タップします。</li>
                <li>合言葉入力欄に上の合言葉を入力します。</li>
                <li>支援者設定で、対象の機能がオンになっていることを確認します。</li>
            </ol>

            <div id="thanksNote" class="note">
                設定はこの端末のブラウザに保存されます。別の端末や別のブラウザで使う場合は、同じ手順で有効にしてください。
            </div>

            <div class="actions">
                <a class="button primary" href="./">スコアブックを開く</a>
            </div>
        </section>
    </main>
    <script>
        const featureGuides = {
            footer: {
                title: "PDFフッター編集を有効にできます。",
                lead: "PDFに表示される既定のフッター文言を、この端末で自由に編集できます。",
                code: "◇余白27◇",
                linkId: "featureLinkFooter",
                steps: [
                    "スコアブックを開き、新規試合を始めます。",
                    "新規試合を始めた後、画面左上のバージョン表示を7回タップします。",
                    "合言葉入力欄に上の合言葉を入力します。",
                    "「フッター編集を有効にする」を押します。",
                    "支援者設定で「PDFフッター編集を有効にする」をオンにし、文言を編集します。"
                ]
            },
            saves: {
                title: "保存上限を解除できます。",
                lead: "無料版の内部保存30試合制限を、この端末で解除できます。",
                code: "◇背番号31◇",
                linkId: "featureLinkSaves",
                steps: [
                    "スコアブックを開き、新規試合を始めます。",
                    "新規試合を始めた後、画面左上のバージョン表示を7回タップします。",
                    "合言葉入力欄に上の合言葉を入力します。",
                    "「保存上限を解除する」を押します。",
                    "支援者設定で「保存済み試合の上限を解除する」がオンになっていることを確認します。"
                ]
            },
            share: {
                title: "チームメンバー共有の準備ができます。",
                lead: "チームメンバー共有機能の支援者枠を、この端末に登録できます。",
                code: "□円陣64□",
                linkId: "featureLinkShare",
                steps: [
                    "スコアブックを開き、新規試合を始めます。",
                    "新規試合を始めた後、画面左上のバージョン表示を7回タップします。",
                    "合言葉入力欄に上の合言葉を入力します。",
                    "「チーム共有を有効にする」を押します。",
                    "支援者設定で「チームメンバー共有を有効にする」がオンになっていることを確認します。"
                ],
                note: "チームメンバー共有は本体側の機能実装を進めている段階です。先に支援者枠だけ登録できます。"
            }
        };

        function setText(id, value) {
            const element = document.getElementById(id);
            if (element) {
                element.textContent = value;
            }
        }

        function fallbackCopyText(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.setAttribute("readonly", "");
            textArea.style.position = "fixed";
            textArea.style.top = "-1000px";
            textArea.style.left = "-1000px";
            document.body.append(textArea);
            textArea.focus();
            textArea.select();
            const didCopy = document.execCommand("copy");
            textArea.remove();
            if (!didCopy) {
                throw new Error("copy failed");
            }
        }

        let copyStatusTimer = null;

        function setCopyStatus(message, isError = false) {
            const status = document.getElementById("copyStatus");
            const button = document.getElementById("copyPassphraseButton");
            if (status) {
                status.textContent = message;
                status.classList.toggle("error", isError);
            }
            if (button) {
                button.classList.toggle("copied", Boolean(message) && !isError);
            }
            if (copyStatusTimer) {
                clearTimeout(copyStatusTimer);
            }
            if (message) {
                copyStatusTimer = setTimeout(() => setCopyStatus("", false), 1800);
            }
        }

        async function copyPassphraseCode() {
            const code = document.getElementById("passphraseCode")?.textContent?.trim();
            if (!code) {
                setCopyStatus("コピーする合言葉がありません。", true);
                return;
            }
            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(code);
                } else {
                    fallbackCopyText(code);
                }
                setCopyStatus("コピーしました。");
            } catch (error) {
                setCopyStatus("コピーできませんでした。長押しで選択してください。", true);
            }
        }

        function renderGuide() {
            const params = new URLSearchParams(window.location.search);
            const requestedFeature = params.get("feature") || "footer";
            const guide = featureGuides[requestedFeature] || featureGuides.footer;
            const steps = document.getElementById("thanksSteps");
            setText("thanksTitle", guide.title);
            setText("thanksLead", guide.lead);
            setText("passphraseCode", guide.code);
            setCopyStatus("", false);
            if (steps) {
                steps.textContent = "";
                guide.steps.forEach((step) => {
                    const item = document.createElement("li");
                    item.textContent = step;
                    steps.append(item);
                });
            }
            setText("thanksNote", guide.note || "設定はこの端末のブラウザに保存されます。別の端末や別のブラウザで使う場合は、同じ手順で有効にしてください。");
            Object.values(featureGuides).forEach((item) => {
                const link = document.getElementById(item.linkId);
                if (link) {
                    link.classList.toggle("active", item === guide);
                }
            });
        }

        renderGuide();
    </script>
</body>
</html>
