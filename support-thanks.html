<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ご支援ありがとうございます | スコアブック by CuViu</title>
    <style>
        :root {
            --ink: #172331;
            --muted: #607180;
            --line: #d7e4ea;
            --accent: #0f766e;
            --soft: #eef8fb;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #f4fbff;
            color: var(--ink);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            line-height: 1.7;
        }

        main {
            width: min(760px, calc(100vw - 28px));
            margin: 0 auto;
            padding: 28px 0 40px;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            min-height: 38px;
            padding: 6px 14px;
            border: 2px solid #cfe1eb;
            border-radius: 999px;
            background: #ffffff;
            color: var(--accent);
            font-size: 15px;
            font-weight: 900;
        }

        .panel {
            margin-top: 18px;
            padding: 24px;
            border: 2px solid var(--line);
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.94);
            box-shadow: 0 18px 45px rgba(23, 35, 49, 0.08);
        }

        h1 {
            margin: 0 0 12px;
            font-size: clamp(28px, 8vw, 44px);
            line-height: 1.18;
            letter-spacing: 0;
        }

        p {
            margin: 0;
            color: var(--muted);
            font-size: 16px;
            font-weight: 700;
        }

        .steps {
            display: grid;
            gap: 10px;
            margin: 22px 0 0;
            padding: 0;
            list-style: none;
            counter-reset: step;
        }

        .steps li {
            counter-increment: step;
            display: grid;
            grid-template-columns: 34px minmax(0, 1fr);
            gap: 10px;
            align-items: start;
            padding: 12px;
            border: 1.5px solid var(--line);
            border-radius: 12px;
            background: var(--soft);
            color: var(--ink);
            font-size: 16px;
            font-weight: 850;
        }

        .steps li::before {
            content: counter(step);
            display: grid;
            place-items: center;
            width: 30px;
            height: 30px;
            border-radius: 999px;
            background: var(--accent);
            color: #ffffff;
            font-size: 15px;
            font-weight: 900;
            line-height: 1;
        }

        .note {
            margin-top: 18px;
            padding: 12px 14px;
            border-left: 5px solid var(--accent);
            border-radius: 10px;
            background: #ffffff;
            color: var(--muted);
            font-size: 14px;
            font-weight: 750;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 22px;
        }

        .button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            min-height: 48px;
            padding: 10px 14px;
            border: 2px solid #243447;
            border-radius: 12px;
            background: #ffffff;
            color: var(--ink);
            font-size: 16px;
            font-weight: 900;
            text-align: center;
            text-decoration: none;
        }

        .button.primary {
            border-color: var(--accent);
            background: var(--accent);
            color: #ffffff;
        }

        @media (max-width: 520px) {
            .panel {
                padding: 20px;
            }

            .actions {
                display: block;
            }
        }
    </style>
</head>
<body>
    <main>
        <div class="brand">CuViu Scorebook</div>
        <section class="panel" aria-labelledby="thanksTitle">
            <h1 id="thanksTitle">ご支援ありがとうございます。</h1>
            <p>支援者向けに、PDFフッター文言の編集を使えるようにしています。</p>

            <ol class="steps">
                <li>スコアブックを開き、新規試合を始めます。</li>
                <li>新規試合を始めた後、画面左上のバージョン表示を7回タップします。</li>
                <li>支援者設定が開いたら、「PDFフッター編集を有効にする」をオンにします。</li>
                <li>PDFフッター文言を好きな内容に編集します。</li>
            </ol>

            <div class="note">
                設定はこの端末のブラウザに保存されます。別の端末や別のブラウザで使う場合は、同じ手順で有効にしてください。
            </div>

            <div class="actions">
                <a class="button primary" href="./">スコアブックを開く</a>
            </div>
        </section>
    </main>
</body>
</html>
